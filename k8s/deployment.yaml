apiVersion: apps/v1
kind: Deployment
metadata:
  name: attention-metrics-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attention-metrics-server
  template:
    metadata:
      labels:
        app: attention-metrics-server
    spec:
      containers:
        - name: attention-metrics-server
          image: ghcr.io/vinhthang/attention-metrics-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8086
          env:
            - name: PORT
              value: "8086"
            - name: DATABASE_URL
              value: "postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable"
